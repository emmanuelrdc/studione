[phases.setup]
# pnpm@11.4.0 requires Node >= 22.13, and a current corepack requires
# >= 22.22.2 / >= 24.15.0 — this nixpkgs snapshot's nodejs_22 resolves to
# 22.11.0, which satisfies neither. nodejs_24 matches what's already
# validated locally (Node v24.18.0).
nixPkgs = ["nodejs_24"]

# Nixpacks pins corepack@0.24.1 by default, which has a bug running pnpm's
# CJS bundle (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING — corepack's
# Module._compile wrapper doesn't forward the dynamic import() callback).
# Use a current corepack instead, where this is fixed.
[phases.install]
cmds = [
  "npm install -g corepack@latest",
  "corepack enable",
  "pnpm i --frozen-lockfile"
]
